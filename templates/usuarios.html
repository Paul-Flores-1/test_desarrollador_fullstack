{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> Administración de Usuarios</h2>
        <div>
            <button id="btn-nuevo-usuario" class="btn btn-info text-white shadow-sm me-2 d-none" data-bs-toggle="modal" data-bs-target="#usuarioModal">
                <i class="bi bi-person-plus-fill"></i> Nuevo Usuario
            </button>
            <a href="/dashboard/" class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </div>

    <div class="card shadow mb-5" id="tabla-usuarios-admin">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>Usuario</th><th>Email</th><th>Estado</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="bi bi-person-plus"></i> Registrar Nuevo Usuario</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <div class="mb-3"><label class="form-label">Nombre de usuario</label><input type="text" id="usr-username" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="usr-email" class="form-control" required></div>
                    <div class="mb-4"><label class="form-label">Contraseña</label><input type="password" id="usr-password" class="form-control" required></div>
                    <button type="submit" class="btn btn-info text-white w-100 fw-bold">Crear Usuario</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
