{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box-seam"></i> Gestión de Productos</h2>
        <div>
            <button class="btn btn-primary shadow-sm me-2" data-bs-toggle="modal" data-bs-target="#productoModal">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </button>
            <a href="/dashboard/" class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
        </div>
    </div>

    <div class="card shadow mb-5">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="productoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Agregar Nuevo Producto</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formProducto">
                    <div class="mb-3"><label class="form-label">Nombre</label><input type="text" id="prod-nombre" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Descripción</label><textarea id="prod-desc" class="form-control" required></textarea></div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Categoría</label><input type="text" id="prod-cat" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Precio</label><input type="number" step="0.01" id="prod-precio" class="form-control" required></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Stock inicial</label><input type="number" id="prod-stock" class="form-control" value="0" required></div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
