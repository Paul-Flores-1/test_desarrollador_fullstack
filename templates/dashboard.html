{% extends 'base.html' %}
{% load static %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Panel Administrativo</a>
        <div class="d-flex">
            <button class="btn btn-danger btn-sm shadow-sm" onclick="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Resumen del Sistema</h2>
        <a href="/api/reportes/exportar/" class="btn btn-success shadow-sm">
            <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
        </a>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-white bg-success shadow h-100" style="cursor: pointer;" onclick="window.location.href='/productos/'">
                <div class="card-body">
                    <h5 class="card-title">Total de Productos</h5>
                    <h2 class="display-4" id="total-productos">0</h2>
                    <p class="mb-0 text-end"><small>Ir a Productos <i class="bi bi-arrow-right-circle"></i></small></p>
                </div>
            </div>
        </div>
        <div class="col-md-6" id="card-usuarios-admin">
            <div class="card text-white bg-info shadow h-100" style="cursor: pointer;" onclick="window.location.href='/usuarios/'">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title">Usuarios Registrados</h5>
                        <h2 class="display-4" id="total-usuarios">0</h2>
                    </div>
                    <p class="mb-0 text-end"><small>Ir a Usuarios <i class="bi bi-arrow-right-circle"></i></small></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
