{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f4f7f6;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                
                <div class="text-center mb-4">
                    <div class="d-inline-block bg-primary text-white rounded-circle p-3 mb-3 shadow-sm">
                        <i class="bi bi-box-seam" style="font-size: 2rem;"></i>
                    </div>
                    <h3 class="fw-bold">Bienvenido</h3>
                    <p class="text-muted">Ingresa al panel administrativo</p>
                </div>

                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" placeholder="Usuario" required>
                        <label for="username"><i class="bi bi-person text-muted me-1"></i> Usuario</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                        <label for="password"><i class="bi bi-lock text-muted me-1"></i> Contraseña</label>
                    </div>

                    <div id="error-msg" class="alert alert-danger d-none py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Credenciales incorrectas.
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm">
                        Iniciar Sesión <i class="bi bi-arrow-right-circle ms-1"></i>
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        try {
            const response = await fetch('/api/token/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                window.location.href = '/dashboard/';
            } else {
                errorMsg.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error al conectar con el servidor.');
        }
    });
</script>
{% endblock %}
